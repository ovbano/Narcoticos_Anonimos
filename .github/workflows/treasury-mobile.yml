name: Tesorería móvil · comprobar y preparar APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Preparar proyecto Android
        working-directory: mobile/tesoreria
        run: |
          flutter create --platforms=android --org ec.amigosverdaderos --project-name amigos_tesoreria --no-pub .
          python scripts/android_setup.py
          flutter pub get
      - name: Analizar y probar
        working-directory: mobile/tesoreria
        run: |
          dart format lib test
          flutter analyze
          flutter test
      - name: Configurar conexión pública
        working-directory: mobile/tesoreria
        env:
          PROJECT_URL: ${{ vars.NA_SUPABASE_URL }}
          PUBLIC_KEY: ${{ vars.NA_SUPABASE_PUBLIC_KEY }}
        run: |
          python - <<'PY'
          import json,os,base64
          from pathlib import Path
          url=os.environ['PROJECT_URL'];key=os.environ['PUBLIC_KEY']
          if not url or not key:raise SystemExit('Configura NA_SUPABASE_URL y NA_SUPABASE_PUBLIC_KEY en Settings > Secrets and variables > Actions > Variables.')
          if not key.startswith('sb_publishable_'):
              try:
                  payload=key.split('.')[1];role=json.loads(base64.urlsafe_b64decode(payload+'='*(-len(payload)%4)))['role']
              except Exception:raise SystemExit('La clave no es anon/publishable.')
              if role!='anon':raise SystemExit('Nunca incluyas claves administrativas en una APK.')
          Path('config.local.json').write_text(json.dumps({'SUPABASE_URL':url,'SUPABASE_ANON_KEY':key}))
          PY
      - name: Preparar APK de prueba
        working-directory: mobile/tesoreria
        run: flutter build apk --debug --dart-define-from-file=config.local.json
      - uses: actions/upload-artifact@v4
        with:
          name: tesoreria-android-prueba
          path: |
            mobile/tesoreria/build/app/outputs/flutter-apk/app-debug.apk
            mobile/tesoreria/pubspec.lock
          retention-days: 7
